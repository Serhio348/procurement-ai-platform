<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Платформа закупок</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      html,
      body {
        background: #1e2430;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .boot {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f4f5f7;
      }
      .boot-card {
        width: min(420px, calc(100% - 32px));
        padding: 28px 28px 32px;
        background: #f4f5f7;
        color: #1c2430;
        border-radius: 8px;
      }
      .boot-mark {
        display: block;
        width: 48px;
        height: 48px;
      }
      .boot-title {
        display: flex;
        flex-direction: column;
        margin: 12px 0 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.03em;
        line-height: 1.15;
      }
      .boot-rule {
        display: block;
        width: 56px;
        height: 1px;
        margin: 14px 0 10px;
        background: #c9a25a;
      }
      .boot-kicker {
        margin: 0;
        color: #5c6778;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-card">
          <svg class="boot-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="2.5" y="2.5" width="43" height="43" rx="10" fill="#2c3548" stroke="#c9a25a" stroke-width="1.5" />
            <rect x="7" y="7" width="34" height="34" rx="7" stroke="#c9a25a" stroke-width="0.7" opacity="0.4" />
            <path d="M15 13.5h12.5L33 19v15.5H15V13.5Z" fill="#eef2f6" />
            <path d="M27.5 13.5V19H33" fill="#c5ccd6" />
            <path d="M19 24h10M19 28h10M19 32h6.5" stroke="#3a5d86" stroke-width="1.4" stroke-linecap="round" />
            <circle cx="33.5" cy="33.5" r="6.2" fill="#c9a25a" />
            <circle cx="33.5" cy="33.5" r="4" stroke="#1e2430" stroke-width="0.85" />
            <path d="M31.7 36.15V31.15h3.6v5h-1.25v-3.75h-1.1v3.75H31.7Z" fill="#1e2430" />
          </svg>
          <p class="boot-title"><span>Платформа</span><span>закупок</span></p>
          <span class="boot-rule"></span>
          <p class="boot-kicker">Консоль специалиста</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
