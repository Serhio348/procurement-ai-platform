# Public console. Browser gets static files; /api goes to Fastify on loopback.
# Install: ln -sfn this file to /etc/nginx/sites-enabled/procurement
# App login is not this file. Do not expose ports 3001 or 5173.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    root /opt/procurement-ai-platform/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
