# Public console. Browser gets static files; /api goes to Fastify on loopback.
# Install: ln -sfn this file to /etc/nginx/sites-enabled/procurement
# After Let's Encrypt, certbot edits /etc/nginx/sites-available/procurement —
# do not copy this file over that site or TLS disappears.
# App login is not this file. Do not expose ports 3001 or 5173.

# Auth endpoints get a tighter request budget than the rest of the API:
# credential guessing and mass sign-ups die at the edge before Fastify.
# GET /api/auth/session is a frequent read — it stays out of the budget.
map $request_method $procurement_auth_key {
    default $binary_remote_addr;
    ~^GET$ "";
}
limit_req_zone $procurement_auth_key zone=procurement_auth:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    root /opt/procurement-ai-platform/apps/web/dist;
    index index.html;

    location /api/auth/ {
        limit_req zone=procurement_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # A manual search holds the request while the source lanes scan — a
    # BUTB registry walk may legally run ~180 s inside a 300 s tool budget,
    # so the generic 180 s proxy timeout would cut the browser off while
    # the backend still works. This one route gets the full budget plus
    # slack; every other endpoint keeps the tighter default.
    location = /api/procurements/search {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # The manual discovery trigger awaits the whole pass across profiles —
    # several scans back to back. A proxy timeout only cuts the response,
    # the pass itself keeps running server-side.
    location = /api/profile/discovery {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
